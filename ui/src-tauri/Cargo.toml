[package]
name = "explorerbender-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Espace de travail séparé : l'interface (Tauri) n'alourdit ni ne ralentit la compilation du démon.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eb-core = { path = "../../crates/core" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"]
