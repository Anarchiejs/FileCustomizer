[package]
name = "filecustomizer-ui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

# Espace de travail séparé : l'interface (Tauri) n'alourdit ni ne ralentit la compilation du démon.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fc-core = { path = "../../crates/core" }

# Builds de dev : sans ces réglages, `target/` dépasse 4 Go (voir le Cargo.toml racine).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"]

[lints.clippy]
undocumented_unsafe_blocks = "warn"
