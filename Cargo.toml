[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli", "crates/elevated-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
windows = "0.62"

# Taille et RAM comptent plus que la vitesse de compilation : le démon doit rester
# résident sous ~5 Mo. `panic = "abort"` retire tout le code de déroulage de pile.
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
