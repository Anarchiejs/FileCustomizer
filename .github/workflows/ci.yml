name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy + tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/src-tauri -> target

      # Tous les avertissements (dont `unsafe` sans `// SAFETY:`) font échouer la CI.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (interface Tauri)
        run: cargo clippy --all-targets --manifest-path ui/src-tauri/Cargo.toml -- -D warnings

      # Aucun effet sur le registre : chaque test d'intégration tourne dans un EXPLORERBENDER_HOME temporaire.
      - name: Tests
        run: cargo test --workspace
